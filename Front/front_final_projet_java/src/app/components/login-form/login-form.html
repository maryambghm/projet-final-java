<div class="auth">
  <form (submit)="onLoginHandler()" class="card">
    <h1>Hi, Welcome! 👋</h1>

    <!-- Email -->
    <div class="field">
      <label for="email">Email address</label>
      <input
        id="email"
        type="email"
        [(ngModel)]="email"
        [ngModelOptions]="{standalone: true}"
        placeholder="Your email"
        required
      />
    </div>

    <!-- Password -->
    <div class="field">
      <label for="password">Password</label>
      <input
        id="password"
        type="password"
        [(ngModel)]="password"
        [ngModelOptions]="{standalone: true}"
        placeholder="Password"
        required
      />
    </div>

    <!-- Submit -->
    <button type="submit" class="primary">Log in</button>

    <p class="meta">
      Don’t have an account?
      <a routerLink="/registerform">Sign up</a>
    </p>
  </form>
</div>
